# Include inside the zjkdongao.cn HTTPS server block. Only fingerprinted Vite
# assets are immutable; HTML and public assets without a hash keep revalidating.
location ~ "^/assets/.*-[A-Za-z0-9_-]{8}\.(js|css|png|jpg|jpeg|gif|svg|webp|ico|woff|woff2)$" {
    root /var/web/mail/mail_frontend;
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
